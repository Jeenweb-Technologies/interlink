<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="linkG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056cf" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="linkG2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0056cf" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background shield/tile with rounded corners -->
  <rect width="48" height="48" rx="12" fill="#0b172b" />
  <g filter="url(#brandGlow)">
    <!-- Left Loop -->
    <path d="M19 14 H15 C10.58 14 7 17.58 7 22 C7 26.42 10.58 30 15 30 H19 C23.42 30 27 26.42 27 22" 
          stroke="url(#linkG1)" stroke-width="4" stroke-linecap="round" />
    <!-- Right Loop (Interlocking) -->
    <path d="M29 34 H33 C37.42 34 41 30.42 41 26 C41 21.58 37.42 18 33 18 H29 C24.58 18 21 21.58 21 26" 
          stroke="url(#linkG2)" stroke-width="4" stroke-linecap="round" />
    <!-- Overlap bridge to give genuine 3D interlink weave -->
    <path d="M19 14 H21 C24.5 14 27 16.5 27 20" 
          stroke="url(#linkG1)" stroke-width="4" stroke-linecap="round" />
    <!-- Center node pulse -->
    <circle cx="24" cy="24" r="2.2" fill="#38bdf8" />
  </g>
</svg>
